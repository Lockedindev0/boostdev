# ============================================================================
# BoostDev Configuration
# Edit with: boostdev config
# ============================================================================

# Anti-Loop Settings
BOOSTDEV_MAX_REPEATS=3          # Number of repeats before triggering loop alert
BOOSTDEV_LOOP_WINDOW=10         # Number of recent commands to check for patterns
BOOSTDEV_AUTO_INJECT=true       # Auto-inject "stop looping" message to Claude
BOOSTDEV_LOOP_TIMEOUT=300       # Seconds before timeout warning (5 min)

# Memory Settings
BOOSTDEV_AUTO_SAVE=true         # Auto-save session context on exit
BOOSTDEV_AUTO_LOAD=true         # Auto-load previous context on start
BOOSTDEV_MEMORY_MAX_SIZE=50     # Max number of session entries per project
BOOSTDEV_EXTRACT_DECISIONS=true # Auto-extract architecture decisions

# Dashboard Settings
BOOSTDEV_LOG_RETENTION=30       # Days to keep logs
BOOSTDEV_SHOW_ESTIMATES=true    # Show estimated token counts

# Notification Settings
BOOSTDEV_SOUND_ALERT=false      # Play sound on loop detection (macOS only)
BOOSTDEV_COLOR_OUTPUT=true      # Colored terminal output
